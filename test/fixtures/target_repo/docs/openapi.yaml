openapi: "3.0.0"
info:
  title: OrderService API
  version: "1.0.0"
  description: REST API for managing users and orders.
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /users:
    get:
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
  /orders:
    get:
      summary: List orders for authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order list
    post:
      summary: Create a new order
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created order
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
